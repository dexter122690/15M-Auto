<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>15M Autocare</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }

      p {
        color: #ff6a2b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>15M Autocare</h1>
      <p>Loading dashboard...</p>
    </main>
    <script>
      try {
        const ownerKey = "15m-owner-report";
        const branchKey = "15m-branch-store";
        const value = JSON.parse(localStorage.getItem(ownerKey) || "null");

        if (value && value.__15mMultiBranch && value.branchData) {
          const selected =
            value.selectedBranchId && value.selectedBranchId !== "all"
              ? value.selectedBranchId
              : "sta-rosa";

          localStorage.setItem(branchKey, JSON.stringify(value));
          localStorage.setItem(ownerKey, JSON.stringify(value.branchData[selected] || {}));
        }
      } catch (_) {}

      (async () => {
        try {
          const files = ["part-001.txt", "part-002.txt", "part-003.txt", "part-004.txt"];
          const encoded = (await Promise.all(files.map((file) => fetch(file).then((response) => response.text())))).join("");
          const html = await new Response(
            new Blob([Uint8Array.from(atob(encoded), (value) => value.charCodeAt(0))])
              .stream()
              .pipeThrough(new DecompressionStream("gzip"))
          ).text();
          const email = String(localStorage.getItem("15m-local-branch-login") || "").toLowerCase();
          const skipStaRosaImports =
            email === "15msto.tomas@gmail.com"
              ? '<script>window.__15mSkipStaRosaImports=true;</' + "script>"
              : "";
          const scripts =
            '<script src="supabase-sync.js?v=branch-data-16"></' +
            "script>" +
            '<script src="stotomas-import.js?v=1"></' +
            "script>" +
            '<script src="expense-actions.js?v=2"></' +
            "script>" +
            '<script src="export-report.js?v=3"></' +
            "script>" +
            '<script src="payroll-portal.js?v=14"></' +
            "script>";

          document.open();
          document.write(
            html
              .replace("<body>", "<body>" + skipStaRosaImports)
              .replace("</body>", scripts + "</body>")
          );
          document.close();
        } catch (error) {
          document.body.innerHTML =
            "<main><h1>15M Autocare</h1><p>Dashboard files are still loading. Please refresh in a moment.</p></main>";
        }
      })();
    </script>
  </body>
</html>
